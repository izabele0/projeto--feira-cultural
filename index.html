
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Voz Acessível</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🔊 Voz Acessível</h1>
        <p>Transformando textos em voz para todos!</p>
    </header>

    <main>

        <label for="texto">
            Digite ou cole seu texto abaixo:
        </label>

        <textarea
            id="texto"
            placeholder="Escreva aqui o texto que deseja ouvir..."
            aria-label="Texto para leitura em voz alta">
        </textarea>

        <div class="configuracoes">

            <label for="voz">Escolha a voz:</label>

            <select id="voz">
                <option value="">Carregando vozes...</option>
            </select>

            <label for="velocidade">
                Velocidade da leitura:
            </label>

            <select id="velocidade">
                <option value="0.7">Lenta</option>
                <option value="1" selected>Normal</option>
                <option value="1.3">Rápida</option>
                <option value="1.6">Muito rápida</option>
            </select>

        </div>

        <div class="botoes">

            <button class="falar" onclick="falar()">
                ▶ Ouvir texto
            </button>

            <button class="pausar" onclick="pausar()">
                ⏸ Pausar
            </button>

            <button class="continuar" onclick="continuar()">
                ▶ Continuar
            </button>

            <button class="parar" onclick="parar()">
                ⏹ Parar
            </button>

            <button class="limpar" onclick="limpar()">
                🗑 Limpar texto
            </button>

        </div>

        <p id="status" role="status" aria-live="polite">
            Pronto para transformar seu texto em áudio!
        </p>

    </main>

    <footer>
        <p>Voz Acessível - Tecnologia e inclusão para todos ❤️</p>
    </footer>

    <script src="java.js"></script>

</body>
</html>
